name: Testing and deploy

on:
  push:
    branches:
      - main

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source and build package
        run: pnpm lint && pnpm package:build && pnpm build
      - name: Testing
        run: pnpm cypress:run && node --test tests/package/package.test.mjs
  deploy:
    runs-on: ubuntu-latest
    needs: cypress
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Copy repository contents via scp
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          source: '.'
          target: ${{ secrets.TARGET }}

      - name: Build app
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          script: |
            cd ${{ secrets.TARGET }}
            corepack pnpm install --frozen-lockfile
            corepack pnpm package:build
