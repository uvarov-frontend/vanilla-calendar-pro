name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

# A newer release must not interrupt a publish already in progress.
concurrency:
  group: npm-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Validate release
    if: github.repository == 'uvarov-frontend/vanilla-calendar-pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Require a tagged commit from main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Check release metadata against the source version
        run: node .github/scripts/release.mjs --source

  checks:
    name: Release checks
    needs: release
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish verified build to npm
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist
          path: package/dist
      - name: Verify the downloaded package and choose its npm tag
        id: metadata
        run: node .github/scripts/release.mjs
      - name: Publish with npm Trusted Publishing
        working-directory: package/dist
        env:
          NPM_DIST_TAG: ${{ steps.metadata.outputs.dist-tag }}
        run: npm publish --access public --tag "$NPM_DIST_TAG" --provenance --ignore-scripts --registry=https://registry.npmjs.org
