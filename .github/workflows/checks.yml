name: Checks

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Code and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'release' }}
      - run: pnpm lint
      - run: pnpm test:ci
      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  build:
    name: Build and package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'release' }}
      # package:build includes TypeScript checking and generates declarations.
      - run: pnpm package:build
      - run: pnpm build
      - name: Check the packed package and bundle budgets
        run: node --test tests/package/package.test.mjs | tee "$RUNNER_TEMP/package-tests.log"
      - name: Save package test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-test-results
          path: ${{ runner.temp }}/package-tests.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Share the tested build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-dist
          path: package/dist/
          retention-days: 7
          if-no-files-found: error

  browsers:
    name: Browser (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [electron, chrome, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'release' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist
          path: package/dist
      - name: Cache Cypress binary
        if: github.event_name != 'release'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browser system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb
      - name: Cache WebKit binary
        if: matrix.browser == 'webkit' && github.event_name != 'release'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install WebKit and its system libraries
        if: matrix.browser == 'webkit'
        run: pnpm exec playwright install --with-deps webkit
      # Chrome and Firefox are provided by the GitHub-hosted Ubuntu image.
      - name: Install and verify Cypress
        run: |
          pnpm exec cypress install
          pnpm exec cypress verify
          pnpm exec cypress info
      - name: Browser scenarios and native input checks
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          TMPDIR: ${{ runner.temp }}
        run: xvfb-run -a pnpm cypress:run --browser "$TEST_BROWSER"
      - name: Ten-timezone regression matrix
        if: ${{ !cancelled() && (matrix.browser == 'chrome' || matrix.browser == 'webkit') }}
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          TMPDIR: ${{ runner.temp }}
        run: node tests/browser/timezones.mjs --browsers="$TEST_BROWSER"
      - name: Save browser reports and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-results-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/vanilla-calendar-tests-*/
            ${{ runner.temp }}/vanilla-calendar-timezones-*/
          retention-days: 14
          if-no-files-found: warn

  ready:
    name: All checks passed
    if: ${{ always() }}
    needs: [quality, build, browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSERS_RESULT: ${{ needs.browsers.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$BROWSERS_RESULT" = success
