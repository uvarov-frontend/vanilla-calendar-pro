name: Checks

on:
  workflow_call:
    outputs:
      code:
        description: Whether the build and browser checks ran ('true') or were skipped for a docs-only change ('false')
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Docs, root Markdown, LICENSE and .github/assets cannot affect the package, so a change that touches
  # only those skips the build and browser checks. Releases, manual runs and anything else run everything.
  changes:
    name: Detect affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with the base commit
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base='' ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git fetch --quiet --depth=1 origin "$base"; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          printf 'Changed files:\n%s\n' "$files"
          if [ -n "$files" ] && ! grep -qvE '^(docs/|[^/]+\.md$|LICENSE$|\.github/assets/)' <<< "$files"; then
            echo 'code=false' >> "$GITHUB_OUTPUT"
          else
            echo 'code=true' >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Code and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'release' }}
      - run: pnpm lint
      - run: pnpm test:ci
      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  build:
    name: Build and package checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'release' }}
      # package:build includes TypeScript checking and generates declarations.
      - run: pnpm package:build
      - run: pnpm build
      - name: Check the packed package and bundle budgets
        run: node --test tests/package/package.test.mjs | tee "$RUNNER_TEMP/package-tests.log"
      - name: Save package test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-test-results
          path: ${{ runner.temp }}/package-tests.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Share the tested build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-dist
          path: package/dist/
          retention-days: 7
          if-no-files-found: error

  browsers:
    name: Browser (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [electron, chrome, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'release' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dist
          path: package/dist
      - name: Cache Cypress binary
        if: github.event_name != 'release'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # A mirror that serves a stale index (digest-mismatch) or stalls must not hold the job until its timeout:
      # bound each attempt and retry. Before a retry, stop whatever apt/dpkg the timed-out attempt left behind
      # (it keeps the dpkg lock), finish an interrupted install and drop the stale package index.
      - name: Install browser system libraries
        timeout-minutes: 12
        run: |
          # A stalled mirror connection fails after 20 s and is retried, instead of hanging; this also covers the
          # apt-get update that playwright install --with-deps runs for WebKit.
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for attempt in 1 2 3; do
            sudo timeout 180 apt-get update &&
              sudo timeout 240 apt-get install --no-install-recommends -y libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb &&
              exit 0
            echo "apt attempt $attempt failed, retrying"
            sudo killall -q -KILL apt-get apt dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
            sudo dpkg --configure -a || true
            sudo rm -rf /var/lib/apt/lists/*
            sleep 15
          done
          exit 1
      - name: Cache WebKit binary
        if: matrix.browser == 'webkit' && github.event_name != 'release'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install WebKit and its system libraries
        if: matrix.browser == 'webkit'
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            timeout 270 pnpm exec playwright install --with-deps webkit && exit 0
            echo "WebKit install attempt $attempt failed, retrying"
            # timeout stops playwright but not the apt-get it started, which would keep the dpkg lock.
            sudo killall -q -KILL apt-get apt dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
            sudo dpkg --configure -a || true
            sudo rm -rf /var/lib/apt/lists/*
            sleep 15
          done
          exit 1
      # Chrome and Firefox are provided by the GitHub-hosted Ubuntu image.
      - name: Install and verify Cypress
        run: |
          pnpm exec cypress install
          pnpm exec cypress verify
          pnpm exec cypress info
      - name: Browser scenarios and native input checks
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          TMPDIR: ${{ runner.temp }}
        run: xvfb-run -a pnpm cypress:run --browser "$TEST_BROWSER"
      - name: Ten-timezone regression matrix
        if: ${{ !cancelled() && (matrix.browser == 'chrome' || matrix.browser == 'webkit') }}
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          TMPDIR: ${{ runner.temp }}
        run: node tests/browser/timezones.mjs --browsers="$TEST_BROWSER"
      - name: Save browser reports and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/vanilla-calendar-tests-*/
            ${{ runner.temp }}/vanilla-calendar-timezones-*/
          retention-days: 14
          if-no-files-found: warn

  ready:
    name: All checks passed
    if: ${{ always() }}
    needs: [changes, quality, build, browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check that applies to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSERS_RESULT: ${{ needs.browsers.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$QUALITY_RESULT" = success
          if [ "$CODE" = false ]; then
            echo 'Docs-only change: build and browser checks skipped.'
            test "$BUILD_RESULT" = skipped
            test "$BROWSERS_RESULT" = skipped
          else
            test "$BUILD_RESULT" = success
            test "$BROWSERS_RESULT" = success
          fi
