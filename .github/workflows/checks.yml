name: Checks

on:
  workflow_call:
    outputs:
      code:
        description: Whether the build and browser checks ran ('true') or were skipped for a docs-only change ('false')
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Docs, root Markdown, LICENSE and .github/assets cannot affect the package, so a change that touches
  # only those skips the build and browser checks. Releases, manual runs and anything else run everything.
  changes:
    name: Detect affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with the base commit
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base='' ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git fetch --quiet --depth=1 origin "$base"; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          printf 'Changed files:\n%s\n' "$files"
          if [ -n "$files" ] && ! grep -qvE '^(docs/|[^/]+\.md$|LICENSE$|\.github/assets/)' <<< "$files"; then
            echo 'code=false' >> "$GITHUB_OUTPUT"
          else
            echo 'code=true' >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Code and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'release' }}
      - run: pnpm lint
      - run: pnpm test:ci
      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  build:
    name: Build and package checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'release' }}
      # package:build includes TypeScript checking and generates declarations.
      - run: pnpm package:build
      - run: pnpm build
      - name: Check the packed package and bundle budgets
        run: node --test tests/package/package.test.mjs | tee "$RUNNER_TEMP/package-tests.log"
      - name: Save package test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-test-results
          path: ${{ runner.temp }}/package-tests.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Share the tested build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-dist
          path: package/dist/
          retention-days: 7
          if-no-files-found: error

  # Electron, Chrome and Firefox run on the hosted runner, which already ships the browsers, xvfb and the
  # libraries they need. Nothing is installed from the runner's Ubuntu mirror, whose stalls used to block deploys.
  browsers:
    name: Browser (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [electron, chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'release' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dist
          path: package/dist
      - name: Cache Cypress binary
        if: github.event_name != 'release'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # verify fails within seconds if the runner image ever stops providing a library Cypress needs.
      - name: Install and verify Cypress
        timeout-minutes: 4
        run: |
          pnpm exec cypress install
          pnpm exec cypress verify
          pnpm exec cypress info
      - name: Browser scenarios and native input checks
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          TMPDIR: ${{ runner.temp }}
        run: xvfb-run -a pnpm cypress:run --browser "$TEST_BROWSER"
      - name: Ten-timezone regression matrix
        if: ${{ !cancelled() && matrix.browser == 'chrome' }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: node tests/browser/timezones.mjs --browsers=chrome
      - name: Save browser reports and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/vanilla-calendar-tests-*/
            ${{ runner.temp }}/vanilla-calendar-timezones-*/
          retention-days: 14
          if-no-files-found: warn

  # WebKit needs libraries the hosted runner lacks. The official Playwright image has them, xvfb and the
  # WebKit build itself, so this job installs nothing. Bump the tag together with playwright-webkit:
  # the package looks for the exact WebKit revision its version ships with.
  browser-webkit:
    name: Browser (webkit)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Docker's default 64 MB /dev/shm is too small for browser renderers.
      options: --shm-size=2g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Node version pinned in package.json over the image's own Node.
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'release' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dist
          path: package/dist
      # The container keeps HOME at /github/home and compresses differently, so it never shares host cache entries.
      - name: Cache Cypress binary
        if: github.event_name != 'release'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-container-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install and verify Cypress
        timeout-minutes: 4
        run: |
          pnpm exec cypress install
          pnpm exec cypress verify
          pnpm exec cypress info
      # Inside a container RUNNER_TEMP is /__w/_temp, which is also where the reports are uploaded from.
      - name: Browser scenarios and native input checks
        run: TMPDIR="$RUNNER_TEMP" xvfb-run -a pnpm cypress:run --browser webkit
      - name: Ten-timezone regression matrix
        if: ${{ !cancelled() }}
        run: TMPDIR="$RUNNER_TEMP" node tests/browser/timezones.mjs --browsers=webkit
      - name: Save browser reports and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-webkit
          path: |
            /__w/_temp/vanilla-calendar-tests-*/
            /__w/_temp/vanilla-calendar-timezones-*/
          retention-days: 14
          if-no-files-found: warn

  ready:
    name: All checks passed
    if: ${{ always() }}
    needs: [changes, quality, build, browsers, browser-webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check that applies to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSERS_RESULT: ${{ needs.browsers.result }}
          WEBKIT_RESULT: ${{ needs.browser-webkit.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$QUALITY_RESULT" = success
          if [ "$CODE" = false ]; then
            echo 'Docs-only change: build and browser checks skipped.'
            test "$BUILD_RESULT" = skipped
            test "$BROWSERS_RESULT" = skipped
            test "$WEBKIT_RESULT" = skipped
          else
            test "$BUILD_RESULT" = success
            test "$BROWSERS_RESULT" = success
            test "$WEBKIT_RESULT" = success
          fi
